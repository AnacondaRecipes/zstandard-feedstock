{% set name = "zstandard" %}
{% set version = "0.25.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7713e1179d162cf5c7906da876ec2ccb9c3a9dcbdffef0cc7f70c3667a205f0b

build:
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - cffi >=2.0.0b   # [py>=314]
    - cffi >=1.17,<2  # [py<314]
    - pip
    - packaging
    - setuptools >=77.0.0
  run:
    - python
    - cffi >=2.0.0b   # [py>=314]
    - cffi >=1.17,<2  # [py<314]

test:
  source_files:
    - tests
  requires:
    - pip
    - hypothesis >=6.111.0
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv tests
  imports:
    - zstandard

about:
  home: https://github.com/indygreg/python-zstandard
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - LICENSE
    - zstd/LICENSE
  summary: Zstandard bindings for Python
  description: |
    This project provides Python bindings for interfacing with the Zstandard compression library.
    A C extension and CFFI interface are provided.
  doc_url: https://python-zstandard.readthedocs.io
  dev_url: https://github.com/indygreg/python-zstandard

extra:
  recipe-maintainers:
    - rmax
    - xhochy
